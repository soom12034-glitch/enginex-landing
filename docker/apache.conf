<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
    DirectoryIndex concept.php index.php
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; connect-src 'self' https://app.enginex2030.com; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self' https://app.enginex2030.com"

AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml

ExpiresActive On
ExpiresByType text/css "access plus 7 days"
ExpiresByType application/javascript "access plus 7 days"
ExpiresByType font/woff2 "access plus 1 year"
ExpiresByType image/webp "access plus 1 year"
ExpiresByType image/svg+xml "access plus 1 year"

<FilesMatch "\.(woff2|webp|svg)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
