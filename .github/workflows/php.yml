name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # الخطوة 1: سحب الكود الخاص بمشروعك داخل بيئة العمل
    - name: Checkout repository
      uses: actions/checkout@v4

    # الخطوة 2: تهيئة أداة Java (المعروضة في القائمة الجانبية)
    - name: Setup Java JDK
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin' # يمكنك تغيير التوزيعة حسب رغبتك (مثل zulu أو microsoft)
        java-version: '17'      # حدد إصدار الجافا الذي يحتاجه مشروعك (مثلاً: 11, 17, 21)

    # الخطوة 3: تهيئة بيئة PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # حدد إصدار الـ PHP الخاص بمشروعك

    # الخطوة 4: تثبيت حزم الاعتمادية الخاصة بـ PHP (Composer)
    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test
